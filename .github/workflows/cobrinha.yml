name: Generate Datas

on:
  schedule:
    # Executa a cada 12 horas (às 00:00 e 12:00 UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão para a Action escrever no repositório
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: jeanr0cha
          # Gera o arquivo .svg na raiz do diretório de trabalho
          svg_out_path: github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          # O diretório que contém o arquivo a ser enviado é a raiz (.)
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
