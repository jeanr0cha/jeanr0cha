      <tspan x="18" y="331.6">      .....          -+*+++=-:..          .:-=+                         </tspan>
      <tspan x="18" y="341.4">  .......              --=++==----==========++=                         </tspan>
      <tspan x="18" y="351.2">:::..                    .:=+*++++++++++++++++=:                        </tspan>
      <tspan x="18" y="361.0">. ..                        .-=+**+++++++++++++:                        </tspan>
