<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 480" width="100%" height="100%">
  <defs>
    <!-- Monochrome CRT Scanlines -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0, 0, 0, 0.4)" stroke-width="1.2" />
    </pattern>

    <!-- CRT Corner Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75" />
    </radialGradient>
  </defs>

  <style>
    .terminal-bg { fill: #0b0f14; stroke: #1f2937; stroke-width: 1.5; }
    .title-bar { fill: #111827; }
    .title-text { fill: #9ca3af; font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 11px; font-weight: 600; }
    /* Pure White / Silver ASCII text matching the video */
    .ascii-text { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 7.2px; fill: #f0f6fc; font-weight: 600; letter-spacing: 0.8px; }
    .scan-beam { stroke: #f0f6fc; stroke-width: 1.2; opacity: 0.25; }
  </style>

  <!-- Terminal Window Background -->
  <rect width="100%" height="100%" rx="10" class="terminal-bg"/>

  <!-- Window Header -->
  <rect width="100%" height="32" rx="10" class="title-bar"/>
  <rect y="22" width="100%" height="10" class="title-bar"/>
  <line x1="0" y1="32" x2="490" y2="32" stroke="#1f2937" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="18" cy="16" r="4.5" fill="#ff5f56"/>
  <circle cx="32" cy="16" r="4.5" fill="#ffbd2e"/>
  <circle cx="46" cy="16" r="4.5" fill="#27c93f"/>
  <text x="245" y="20" class="title-text" text-anchor="middle">jeanr0cha@terminal: ~ (avatar.ascii)</text>

