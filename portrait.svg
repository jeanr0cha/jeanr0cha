  <!-- Animated Laser Scanning Beam (SMIL) -->
  <line x1="0" y1="32" x2="490" y2="32" class="scan-beam">
    <animate attributeName="y1" values="32;480;32" dur="5s" repeatCount="indefinite" />
    <animate attributeName="y2" values="32;480;32" dur="5s" repeatCount="indefinite" />
  </line>

  <!-- CRT Scanlines & Vignette -->
  <rect y="32" width="100%" height="448" fill="url(#scanlines)" pointer-events="none" />
  <rect width="100%" height="100%" rx="10" fill="url(#vignette)" pointer-events="none" />
</svg>