      <tspan x="18" y="184.6">          =:+%%%%-.*###%####***+++*#%####****+++++++**+*#*=-            </tspan>
      <tspan x="18" y="194.4">         .=:#%%*=++**###%%%%###*#########*************++#*=.            </tspan>
      <tspan x="18" y="204.2">          :=*%+..****###%%%%%####*+*##%###**+****#***+++#+:             </tspan>
